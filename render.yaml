services:
  - type: web
    name: salon-dkaiza
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Misma cadena de conexión de Neon que se usa en local.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: AdminInicial__Email
        sync: false
      - key: AdminInicial__Password
        sync: false
      - key: RecepcionistaInicial__Email
        sync: false
      - key: RecepcionistaInicial__Password
        sync: false
      - key: MercadoPago__AccessToken
        sync: false
      - key: MercadoPago__PublicKey
        sync: false
