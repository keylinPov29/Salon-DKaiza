databases:
  - name: dkaiza-db
    databaseName: dkaiza
    user: dkaiza
    plan: free

services:
  - type: web
    name: salon-dkaiza
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dkaiza-db
          property: connectionString
      - key: AdminInicial__Email
        sync: false
      - key: AdminInicial__Password
        sync: false
      - key: RecepcionistaInicial__Email
        sync: false
      - key: RecepcionistaInicial__Password
        sync: false
      - key: MercadoPago__AccessToken
        sync: false
      - key: MercadoPago__PublicKey
        sync: false
